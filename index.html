<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Constancias</title>

    <meta name="description"
        content="Generador de constancias de participación de la Secretaría de Salud del Estado de Jalisco.">

    <meta property="og:title" content="Generador de Constancias">
    <meta property="og:description"
        content="Generador de constancias de participación de la Secretaría de Salud del Estado de Jalisco.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://generador-constancias.vercel.app/">
    <meta property="og:image"
        content="https://generador-constancias.vercel.app/img/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700;900&display=swap"
        rel="stylesheet">

    <!-- Librerías para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-slate-100 p-6 flex flex-col items-center min-h-screen overflow-x-hidden">

    <!-- ============================================
         PANEL DE CONTROL
    ============================================ -->

    <div class="no-print bg-white p-6 rounded-xl shadow-lg mb-8 w-full max-w-5xl border-t-4 border-teal-600">

        <div class="flex justify-between items-center mb-6 border-b pb-4">

            <h2 class="text-2xl font-bold text-gray-800">
                Generador de Constancias
            </h2>

            <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-semibold">

                <img
                    src="img/logo.png"
                    alt="Logo secretaria de salud"
                    class="h-8 w-auto object-contain inline-block mr-2"
                >

            </span>

        </div>


        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Columna izquierda -->
            <div class="space-y-4">

                <!-- Nombre -->
                <div>

                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">
                        Nombre del Participante
                    </label>

                    <input
                        type="text"
                        id="inputNombre"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none transition"
                        placeholder="Ej. Dra. María González"
                        oninput="actualizarConstancia()"
                    >

                </div>


                <!-- Rol -->
                <div>

                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">
                        Rol / Tipo de Participación
                    </label>

                    <select
                        id="inputRol"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-white transition"
                        onchange="actualizarConstancia()"
                    >

                        <option value="su valiosa participación como ASISTENTE">
                            ASISTENTE
                        </option>

                        <option value="su destacada participación como PONENTE">
                            PONENTE
                        </option>

                        <option value="su colaboración como ORGANIZADOR">
                            ORGANIZADOR
                        </option>

                        <option value="su participación como MODERADOR">
                            MODERADOR
                        </option>

                    </select>

                </div>


                <!-- Evento -->
                <div>

                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">
                        Nombre del Evento
                    </label>

                    <textarea
                        id="inputEvento"
                        rows="3"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none transition resize-none text-sm"
                        oninput="actualizarConstancia()"
                    >Dirección de Investigación de la Secretaría de Salud</textarea>

                </div>

            </div>


            <!-- Columna derecha -->
            <div class="space-y-4">

                <!-- Detalles -->
                <div>

                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">
                        Detalles (Fecha y Lugar)
                    </label>

                    <textarea
                        id="inputDetalles"
                        rows="2"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none transition resize-none text-sm"
                        oninput="actualizarConstancia()"
                    >Dirección de Investigación de la Secretaría de Salud</textarea>

                </div>


                <!-- Firma -->
                <div class="space-y-3 p-4 bg-gray-50 rounded-lg border border-gray-200">

                    <h3 class="font-bold text-gray-700 text-sm border-b pb-2 mb-2">
                        Imágenes (Firma)
                    </h3>


                    <div class="grid grid-cols-2 gap-2 mt-2">

                        <div>

                            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-1">
                                Nombre Firmante
                            </label>

                            <input
                                type="text"
                                id="inputFirmaNombre"
                                value="Dr. Baeza Alzaga"
                                class="w-full border border-gray-300 rounded-lg p-1 text-xs"
                                oninput="actualizarConstancia()"
                            >

                        </div>


                        <div>

                            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-1">
                                Cargo
                            </label>

                            <input
                                type="text"
                                id="inputFirmaCargo"
                                value="Cargo"
                                class="w-full border border-gray-300 rounded-lg p-1 text-xs"
                                oninput="actualizarConstancia()"
                            >

                        </div>

                    </div>


                    <!-- Imagen firma -->
                    <div class="mt-2">

                        <label class="block text-[10px] font-bold text-teal-600 uppercase tracking-wide mb-1">
                            Subir Imagen de Firma (PNG)
                        </label>

                        <input
                            type="file"
                            id="inputFirmaImg"
                            accept="image/*"
                            class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer"
                            onchange="cargarFirma(event)"
                        >

                    </div>

                </div>


                <!-- Botón -->
                <div class="flex items-end mt-2">

                    <button
                        onclick="descargarPDF()"
                        id="btnDownload"
                        class="w-full bg-gradient-to-r from-blue-900 to-teal-700 hover:from-blue-800 hover:to-teal-600 text-white font-bold py-2 px-6 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2 transform hover:-translate-y-0.5"
                    >

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                            />

                        </svg>

                        Descargar PDF

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ============================================
         CONSTANCIA
    ============================================ -->

    <div class="constancia-wrapper">

        <div
            id="constancia-container"
            class="bg-white relative shadow-2xl text-gray-800 mx-auto flex flex-col overflow-hidden"
            style="
                width: 1123px;
                height: 794px;
                min-width: 1123px;
                min-height: 794px;
            "
        >

            <!-- Barras -->
            <div class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-blue-900 via-teal-500 to-blue-900 z-20"></div>

            <div class="absolute bottom-0 left-0 w-full h-5 bg-gradient-to-r from-blue-900 via-teal-500 to-blue-900 z-20"></div>


            <!-- Marco -->
            <div class="absolute top-6 left-6 right-6 bottom-8 border border-gray-200 z-10 pointer-events-none"></div>


            <!-- CONTENIDO -->
            <div class="relative z-30 h-full flex flex-col px-12 pt-8 pb-10">


                <!-- HEADER -->
                <header class="flex justify-between items-start">

                    <div class="flex items-center gap-6 mt-2">

                        <img
                            src="img/logo.png"
                            alt="Logo secretaria de salud"
                            class="h-24 w-auto object-contain"
                        >

                    </div>

                </header>


                <!-- TÍTULOS -->
                <div class="text-center mt-4">

                    <h1 class="text-lg font-bold text-gray-500 tracking-[0.2em] uppercase font-serif-title">
                        Secretaría de Salud del Estado de Jalisco
                    </h1>

                </div>


                <!-- CUERPO -->
                <main class="constancia-main flex flex-col items-center text-center">

                    <p class="text-base text-gray-500 italic mb-1 font-light">
                        Otorgan la presente
                    </p>

                    <h2 class="text-5xl font-serif-title font-bold text-blue-900 mb-4 tracking-widest text-shadow-sm">
                        CONSTANCIA
                    </h2>

                    <p class="text-lg text-gray-600 mb-1">
                        A:
                    </p>


                    <!-- NOMBRE -->
                    <div class="nombre-container relative w-full max-w-4xl">

                        <h3
                            id="displayNombre"
                            class="font-bold text-gray-800 w-full font-serif-title nombre-text"
                        >
                            Nombre del Participante
                        </h3>

                    </div>


                    <!-- TEXTO -->
                    <div class="max-w-5xl mx-auto space-y-2 mt-4">

                        <p class="text-xl text-gray-700 leading-relaxed font-light">

                            Por

                            <span
                                id="displayRol"
                                class="font-bold text-teal-800"
                            >
                                su participación
                            </span>

                            en el evento:

                        </p>


                        <div class="relative px-8">

                            <span class="absolute top-0 left-0 text-3xl text-gray-300 font-serif-title">
                                “
                            </span>

                            <h4
                                id="displayEvento"
                                class="text-2xl font-bold text-blue-900 leading-tight px-4"
                            >
                                Dirección de Investigación de la Secretaría de Salud
                            </h4>

                            <span class="absolute bottom-0 right-0 text-3xl text-gray-300 font-serif-title">
                                ”
                            </span>

                        </div>


                        <p
                            id="displayDetalles"
                            class="text-base text-gray-600 mt-3 px-12 leading-relaxed"
                        >
                            (Detalles)
                        </p>

                    </div>

                </main>


                <!-- FOOTER -->
                <footer class="constancia-footer flex flex-col items-center justify-end w-full relative z-40">

                    <div class="flex flex-col items-center justify-end relative">

                        <!-- Firma -->
                        <div class="h-20 w-64 flex items-end justify-center mb-1">

                            <img
                                id="displayImgFirma"
                                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                                class="max-h-full max-w-full object-contain"
                                alt=""
                            >

                        </div>


                        <!-- Línea -->
                        <div class="w-80 h-0.5 bg-gray-900 mb-2"></div>


                        <!-- Datos -->
                        <p
                            id="displayFirmaNombre"
                            class="font-bold text-gray-950 text-lg font-serif-title tracking-tight text-center"
                        >
                            Baeza Alzaga
                        </p>


                        <p
                            id="displayFirmaCargo"
                            class="text-sm text-gray-700 font-bold uppercase tracking-wide text-center"
                        >
                            Cargo
                        </p>


                    </div>


                    <div class="mt-6"></div>

                </footer>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
